name = "adding-machine-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
VERSION = "0.1.0"

# Resolve core from TypeScript source so wrangler doesn't need a pre-built dist/
[alias]
"@adding-machine/core" = "../core/src/index.ts"
"@adding-machine/mcp" = "../mcp/src/index.ts"

# Rate limiting: 60 req/min per IP. namespace_id is arbitrary for local dev;
# must match a rate limit rule in the Cloudflare dashboard for production.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
